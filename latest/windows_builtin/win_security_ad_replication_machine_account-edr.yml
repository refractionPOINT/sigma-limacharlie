detect:
  event: WEL
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: and
      rules:
      - case sensitive: false
        op: is
        path: event/EVENT/System/EventID
        value: '4662'
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/EVENT/EventData/Properties
          value: 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
        - case sensitive: false
          op: contains
          path: event/EVENT/EventData/Properties
          value: 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2
        - case sensitive: false
          op: contains
          path: event/EVENT/EventData/Properties
          value: 9923a32a-3607-11d2-b9be-0000f87a36b2
        - case sensitive: false
          op: contains
          path: event/EVENT/EventData/Properties
          value: 89e95b76-444d-4c62-991a-0facbeda640c
      - case sensitive: false
        op: ends with
        path: event/EVENT/EventData/SubjectUserName
        value: $
    - case sensitive: false
      not: true
      op: starts with
      path: event/EVENT/EventData/SubjectUserSid
      value: S-1-5-18
respond:
- action: report
  metadata:
    author: Benjamin Delpy, Florian Roth (Nextron Systems), Scott Dermett, Sorina
      Ionescu
    description: "Detects suspicious Active Directory Replication Service (ADRS) requests\
      \ originating from\na machine account (SubjectUserName ending in '$') rather\
      \ than a legitimate Domain Controller.\n\nUnder normal operation, only Domain\
      \ Controllers initiate replication requests carrying the\nDS-Replication-Get-Changes-All\
      \ right. If a threat actor obtains valid machine account\ncredentials \u2014\
      \ for example by abusing certificate-based authentication (PKINIT) to\nimpersonate\
      \ a DC after exploiting a CA vulnerability such as CVE-2026-54121 (Certighost),\n\
      where a temporary machine account is created to request a DC certificate and\
      \ then used to\nperform DCSync \u2014 they can dump all domain credential material\
      \ including the krbtgt hash.\n"
    falsepositives:
    - Valid DC Sync that is not covered by the filters; please report
    level: medium
    references:
    - https://twitter.com/gentilkiwi/status/1003236624925413376
    - https://gist.github.com/gentilkiwi/dcc132457408cf11ad2061340dcb53c2
    - https://blog.blacklanternsecurity.com/p/detecting-dcsync?s=r
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4662
    - https://github.com/aniqfakhrul/CVE-2026-54121
    tags:
    - attack.credential-access
    - attack.s0002
    - attack.t1003.006
    - cve.2026-54121
  name: Suspicious Machine Account Replication - DcSync Indicator

