detect:
  log type: wel
  op: and
  rules:
  - case sensitive: false
    op: is
    path: Event/System/EventID
    value: '16403'
  - op: or
    rules:
    - case sensitive: false
      op: contains
      path: Event/EventData/RemoteName
      value: .githubusercontent.com
    - case sensitive: false
      op: contains
      path: Event/EventData/RemoteName
      value: anonfiles.com
