detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: or
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: ends with
          path: event/FILE_PATH
          value: \powershell.exe
        - case sensitive: false
          op: ends with
          path: event/FILE_PATH
          value: \pwsh.exe
      - op: or
        rules:
        - case sensitive: false
          op: is
          path: event/ORIGINAL_FILE_NAME
          value: PowerShell.EXE
        - case sensitive: false
          op: is
          path: event/ORIGINAL_FILE_NAME
          value: pwsh.dll
    - op: or
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: 0x0.st
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: anonfiles.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: bashupload.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: cdn.discordapp.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: chunk.io
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ddns.net
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: dl.dropboxusercontent.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ghostbin.co
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: glitch.me
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: gofile.io
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: hastebin.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: mediafire.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: mega.nz
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: onrender.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: pages.dev
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: paste.ee
      - case sensitive: false
