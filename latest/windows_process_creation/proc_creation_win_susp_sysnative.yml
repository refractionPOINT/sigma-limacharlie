detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: and
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: :\Windows\Sysnative\
        - case sensitive: false
          op: contains
          path: event/FILE_PATH
          value: :\Windows\Sysnative\
      - not: true
        op: and
        rules:
        - op: or
          rules:
          - case sensitive: false
            op: contains
            path: event/FILE_PATH
            value: C:\Windows\Microsoft.NET\Framework64\v
          - case sensitive: false
            op: contains
            path: event/FILE_PATH
            value: C:\Windows\Microsoft.NET\Framework\v
          - case sensitive: false
            op: contains
            path: event/FILE_PATH
            value: C:\Windows\Microsoft.NET\FrameworkArm\v
          - case sensitive: false
            op: contains
            path: event/FILE_PATH
            value: C:\Windows\Microsoft.NET\FrameworkArm64\v
        - case sensitive: false
          op: ends with
          path: event/FILE_PATH
          value: \ngen.exe
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: install
    - not: true
      op: and
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: '"C:\Windows\sysnative\cmd.exe"'
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: \xampp\
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: \catalina_start.bat
respond:
- action: report
  metadata:
    author: Max Altgelt (Nextron Systems)
    description: Detects process creation events that use the Sysnative folder (common
      for CobaltStrike spawns)
    falsepositives:
    - Unknown
    level: medium
    references:
    - https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
    tags:
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1055
  name: Process Creation Using Sysnative Folder

