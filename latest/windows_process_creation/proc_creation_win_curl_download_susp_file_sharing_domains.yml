        op: contains
        path: event/COMMAND_LINE
        value: storjshare.io
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: supabase.co
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: temp.sh
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: transfer.sh
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: trycloudflare.com
      - case sensitive: false
