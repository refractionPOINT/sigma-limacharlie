        path: event/COMMAND_LINE
        value: workers.dev
    - case sensitive: false
      op: contains
      path: event/COMMAND_LINE
      value: http
    - op: or
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ' -O'
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: --remote-name
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: --output
    - op: or
      rules:
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: .ps1
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: .ps1'
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: .ps1"
