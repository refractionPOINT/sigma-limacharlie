        value: mega.nz
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: onrender.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: pages.dev
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: paste.ee
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: pastebin.com
      - case sensitive: false
        op: contains
