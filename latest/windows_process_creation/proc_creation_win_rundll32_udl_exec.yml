detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - case sensitive: false
      op: ends with
      path: event/PARENT/FILE_PATH
      value: \explorer.exe
    - op: or
      rules:
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: \rundll32.exe
      - case sensitive: false
        op: is
        path: event/ORIGINAL_FILE_NAME
        value: RUNDLL32.EXE
    - op: and
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: oledb32.dll
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ',OpenDSLFile '
      - case sensitive: false
        op: matches
        path: event/COMMAND_LINE
        re: .*\\\\Users\\.*\\\\Downloads\\\*
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: .udl
respond:
- action: report
  metadata:
    author: '@kostastsale'
    description: 'Detects the execution of rundll32.exe with the oledb32.dll library
      to open a UDL file.

      Threat actors can abuse this technique as a phishing vector to capture authentication
      credentials or other sensitive data.

      '
    falsepositives:
    - UDL files serve as a convenient and flexible tool for managing and testing database
      connections in various development and administrative scenarios.
    level: medium
    references:
    - https://trustedsec.com/blog/oops-i-udld-it-again
    tags:
    - attack.defense-evasion
    - attack.execution
    - attack.command-and-control
    - attack.t1218.011
    - attack.t1071
  name: Potentially Suspicious Rundll32.EXE Execution of UDL File

