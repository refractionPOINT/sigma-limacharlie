detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: or
      rules:
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: \certutil.exe
      - case sensitive: false
        op: is
        path: event/ORIGINAL_FILE_NAME
        value: CertUtil.exe
    - op: or
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: 'urlcache '
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: 'verifyctl '
    - op: or
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: .githubusercontent.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: anonfiles.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: cdn.discordapp.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ddns.net
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: dl.dropboxusercontent.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ghostbin.co
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: glitch.me
