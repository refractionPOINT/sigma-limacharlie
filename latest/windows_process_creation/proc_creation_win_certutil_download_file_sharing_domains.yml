        value: hastebin.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: mediafire.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: mega.nz
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: onrender.com
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: pages.dev
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: paste.ee
