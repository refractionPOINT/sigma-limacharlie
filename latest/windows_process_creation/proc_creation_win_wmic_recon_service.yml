detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: and
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: ends with
          path: event/FILE_PATH
          value: \WMIC.exe
        - case sensitive: false
          op: is
          path: event/ORIGINAL_FILE_NAME
          value: wmic.exe
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: service
    - not: true
      op: or
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: stopservice
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: startservice
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: Change
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: Create
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: Delete
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: PauseService
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ResumeService
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: SetSecurityDescriptor
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: StartService
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: StopService
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: UserControlService
respond:
- action: report
  metadata:
    author: frack113, Nasreddine Bencherchali (Nextron Systems)
    description: 'An adversary might use WMI to check if a certain remote service
      is running on a remote device.

      When the test completes, a service information will be displayed on the screen
      if it exists.

      A common feedback message is that "No instance(s) Available" if the service
      queried is not running.

      A common error message is "Node - (provided IP or default) ERROR Description
      =The RPC server is unavailable" if the provided remote host is unreachable

      '
    falsepositives:
    - Unknown
    level: medium
    references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wmic
    - https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-service
    tags:
    - attack.execution
    - attack.t1047
  name: Service Reconnaissance Via Wmic.EXE

