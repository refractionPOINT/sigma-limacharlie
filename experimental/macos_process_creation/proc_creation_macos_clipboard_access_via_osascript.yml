detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is mac
  - op: and
    rules:
    - op: and
      rules:
      - case sensitive: true
        op: ends with
        path: event/FILE_PATH
        value: /osascript
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ' -e '
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: clipboard
    - not: true
      op: and
      rules:
      - case sensitive: false
        op: ends with
        path: event/PARENT/FILE_PATH
        value: opencode
      - op: and
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: osascript
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ' -e '
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: set imageData to the clipboard
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: set fileRef
respond:
- action: report
  metadata:
    author: Sohan G (D4rkCiph3r)
    description: Detects access to clipboard content via osascript, which may be used
      for data collection but also occurs in legitimate clipboard utilities and automation
      scripts
    falsepositives:
    - Legitimate clipboard utilities and automation scripts that read or write clipboard
      content
    - Developer tools and IDEs that use osascript for clipboard integration
    level: medium
    references:
    - https://www.sentinelone.com/blog/how-offensive-actors-use-applescript-for-attacking-macos/
    tags:
    - attack.collection
    - attack.execution
    - attack.t1115
    - attack.t1059.002
  name: Clipboard Access Via OSAScript

