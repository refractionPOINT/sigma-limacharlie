detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is linux
  - op: or
    rules:
    - case sensitive: true
      op: ends with
      path: event/FILE_PATH
      value: /groups
    - op: and
      rules:
      - op: or
        rules:
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /cat
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /ed
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /emacs
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /head
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /less
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /makemap
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /more
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /nano
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /sqlite3
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /tail
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /vi
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /vim
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: group
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: gshadow
    - op: and
      rules:
      - case sensitive: true
        op: ends with
        path: event/FILE_PATH
        value: /getent
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ' group'
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ' gshadow'
    - op: and
      rules:
      - case sensitive: true
        op: ends with
        path: event/FILE_PATH
        value: /ypcat
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: group
respond:
- action: report
  metadata:
    author: "\xD6mer G\xFCnal, Alejandro Ortuno, oscd.community"
    description: 'Detects attempts to enumerate local groups and group membership
      via common Linux utilities and sensitive file access.

      Adversaries may read files such as /etc/group and /etc/gshadow, or use tools
      like getent and groups to identify

      group memberships and privilege assignments on a compromised system.

      '
    falsepositives:
    - Legitimate administration activities
    level: low
    references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.001/T1069.001.md
    - https://man7.org/linux/man-pages/man1/getent.1.html
    tags:
    - attack.discovery
    - attack.t1069.001
  name: Local Groups Discovery Attempt - Linux

