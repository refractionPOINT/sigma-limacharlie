detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is linux
  - op: or
    rules:
    - op: and
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: /var/log/syslog
      - op: or
        rules:
        - op: and
          rules:
          - case sensitive: true
            op: ends with
            path: event/FILE_PATH
            value: /rm
          - op: or
            rules:
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: ' -r '
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: ' -f '
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: ' -rf '
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: /var/log/syslog
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /unlink
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /mv
        - op: and
          rules:
          - case sensitive: true
            op: ends with
            path: event/FILE_PATH
            value: /truncate
          - case sensitive: false
            op: contains
            path: event/COMMAND_LINE
            value: '0 '
          - case sensitive: false
            op: contains
            path: event/COMMAND_LINE
            value: /var/log/syslog
          - op: or
            rules:
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: '-s '
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: '-c '
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: --size
        - op: and
          rules:
          - case sensitive: true
            op: ends with
            path: event/FILE_PATH
            value: /ln
          - case sensitive: false
            op: contains
            path: event/COMMAND_LINE
            value: '/dev/null '
          - case sensitive: false
            op: contains
            path: event/COMMAND_LINE
            value: /var/log/syslog
          - op: or
            rules:
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: '-sf '
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: '-sfn '
            - case sensitive: false
              op: contains
              path: event/COMMAND_LINE
              value: '-sfT '
        - op: and
          rules:
          - case sensitive: true
            op: ends with
            path: event/FILE_PATH
            value: /cp
          - case sensitive: false
            op: contains
            path: event/COMMAND_LINE
            value: /dev/null
        - op: and
          rules:
          - case sensitive: true
            op: ends with
            path: event/FILE_PATH
            value: /shred
          - case sensitive: false
            op: contains
            path: event/COMMAND_LINE
            value: '-u '
    - op: or
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ' > /var/log/syslog'
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ' >/var/log/syslog'
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ' >| /var/log/syslog'
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ': > /var/log/syslog'
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: :> /var/log/syslog
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: :>/var/log/syslog
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: '>|/var/log/syslog'
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: journalctl --vacuum
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: journalctl --rotate
respond:
- action: report
  metadata:
    author: Max Altgelt (Nextron Systems), Roberto Rodriguez (Cyb3rWard0g), OTR (Open
      Threat Research), MSTIC
    description: 'Detects specific commands commonly used to remove or empty the syslog.
      Which is a technique often used by attacker as a method to hide their tracks

      '
    falsepositives:
    - Log rotation.
    - Maintenance.
    level: high
    references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
    - https://www.virustotal.com/gui/file/54d60fd58d7fa3475fa123985bfc1594df26da25c1f5fbc7dfdba15876dd8ac5/behavior
    tags:
    - attack.defense-evasion
    - attack.t1070.002
  name: Syslog Clearing or Removal Via System Utilities

