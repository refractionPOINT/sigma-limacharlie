detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is linux
  - op: and
    rules:
    - op: or
      rules:
      - case sensitive: true
        op: ends with
        path: event/FILE_PATH
        value: /c89
      - case sensitive: true
        op: ends with
        path: event/FILE_PATH
        value: /c99
      - case sensitive: true
        op: ends with
        path: event/FILE_PATH
        value: /gcc
    - case sensitive: false
      op: contains
      path: event/COMMAND_LINE
      value: -wrapper
    - op: or
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: /bin/bash,-s
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: /bin/dash,-s
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: /bin/fish,-s
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: /bin/sh,-s
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: /bin/zsh,-s
respond:
- action: report
  metadata:
    author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
    description: 'Detects the use of the "gcc" utility to execute a shell. Such behavior
      may be associated with privilege escalation, unauthorized command execution,
      or to break out from restricted environments.

      '
    falsepositives:
    - Unknown
    level: high
    references:
    - https://gtfobins.github.io/gtfobins/gcc/#shell
    - https://gtfobins.github.io/gtfobins/c89/#shell
    - https://gtfobins.github.io/gtfobins/c99/#shell
    - https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
    tags:
    - attack.discovery
    - attack.t1083
  name: Shell Execution GCC  - Linux

