detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is linux
  - op: and
    rules:
    - op: and
      rules:
      - op: or
        rules:
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /rm
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /rmdir
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /shred
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /unlink
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: /var/log
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: /var/spool/mail
    - not: true
      op: or
      rules:
      - op: and
        rules:
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /rm
        - case sensitive: false
          op: starts with
          path: event/COMMAND_LINE
          value: rm -f /var/log/sysstat/
      - op: and
        rules:
        - case sensitive: true
          op: ends with
          path: event/FILE_PATH
          value: /rm
        - case sensitive: false
          op: starts with
          path: event/COMMAND_LINE
          value: rm -f -- /var/log//dmesg
respond:
- action: report
  metadata:
    author: "\xD6mer G\xFCnal, oscd.community"
    description: 'Detects logs clearing attempts on Linux systems via utilities such
      as ''rm'', ''rmdir'', ''shred'', and ''unlink'' targeting log files and directories.

      Adversaries often try to clear logs to cover their tracks after performing malicious
      activities.

      '
    falsepositives:
    - Legitimate administration activities
    level: medium
    references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
    tags:
    - attack.defense-evasion
    - attack.t1070.002
  name: Linux Logs Clearing Attempts

