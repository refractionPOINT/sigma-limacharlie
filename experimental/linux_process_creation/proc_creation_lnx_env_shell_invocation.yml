detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is linux
  - op: and
    rules:
    - case sensitive: true
      op: ends with
      path: event/FILE_PATH
      value: /env
    - op: or
      rules:
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: /bin/bash
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: /bin/dash
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: /bin/fish
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: /bin/sh
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: /bin/zsh
respond:
- action: report
  metadata:
    author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
    description: 'Detects the use of the env command to invoke a shell. This may indicate
      an attempt to bypass restricted environments, escalate privileges, or execute
      arbitrary commands.

      '
    falsepositives:
    - Github operations such as ghe-backup
    level: high
    references:
    - https://gtfobins.github.io/gtfobins/env/#shell
    - https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
    tags:
    - attack.execution
    - attack.t1059
  name: Shell Invocation via Env Command - Linux

