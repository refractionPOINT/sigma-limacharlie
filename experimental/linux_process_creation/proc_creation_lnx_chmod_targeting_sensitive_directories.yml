detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is linux
  - op: and
    rules:
    - op: and
      rules:
      - case sensitive: true
        op: ends with
        path: event/FILE_PATH
        value: /chmod
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: /tmp/
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: /.Library/
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: /etc/
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: /opt/
    - not: true
      op: or
      rules:
      - op: and
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: chmod --reference=/etc/shells
        - case sensitive: false
          op: ends with
          path: event/PARENT/COMMAND_LINE
          value: /update-shells
      - op: and
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: /etc/
        - op: and
          rules:
          - case sensitive: false
            op: contains
            path: event/PARENT/COMMAND_LINE
            value: /var/lib/dpkg/info/
          - case sensitive: false
            op: contains
            path: event/PARENT/COMMAND_LINE
            value: .postinst configure
      - case sensitive: false
        op: starts with
        path: event/COMMAND_LINE
        value: chmod 700 /tmp/apt-key-gpghome.
      - case sensitive: false
        op: starts with
        path: event/COMMAND_LINE
        value: chmod 755 /var/tmp/mkinitramfs
      - case sensitive: false
        op: is
        path: event/COMMAND_LINE
        value: chmod 0775 /etc/landscape/
      - case sensitive: false
        op: is
        path: event/COMMAND_LINE
        value: chmod 644 /etc/apparmor.d/tunables/home.d/ubuntu
respond:
- action: report
  metadata:
    author: Christopher Peacock @SecurePeacock, SCYTHE @scythe_io
    description: 'Detects chmod targeting files in sensitive directory paths on Linux
      systems.

      Attackers may use chmod to change permissions of files in these directories
      to maintain persistence, escalate privileges, or disrupt system operations.

      '
    falsepositives:
    - Some false positives are to be expected. Apply additional filters as needed
      before pushing to production.
    level: medium
    references:
    - https://www.intezer.com/blog/malware-analysis/new-backdoor-sysjoker/
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1222.002/T1222.002.md
    tags:
    - attack.defense-evasion
    - attack.t1222.002
  name: Chmod Targeting Sensitive Directories

