detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - case sensitive: false
      op: is
      path: event/FILE_PATH
      value: C:\WINDOWS\system32\wbem\scrcons.exe
    - case sensitive: false
      op: is
      path: event/PARENT/FILE_PATH
      value: C:\Windows\System32\svchost.exe
respond:
- action: report
  metadata:
    author: Thomas Patzke
    description: 'Detects the execution of a script event consumer. When scrcons.exe
      launches, it does so in response to the creation of an ActiveScriptEventConsumer
      instance

      and will execute registered JScript or VBScript code as a result.

      Script event consumers are a built-in Windows Management Instrumentation (WMI)
      class that

      automatically executes a predefined script (in VBScript or JScript) whenever
      a specific system event occurs.

      Adversaries often abuse script event consumers to maintain persistence on a
      compromised host

      by executing a malicious script whenever a specific event occurs.

      '
    falsepositives:
    - Legitimate event consumers
    - Dell computers on some versions register an event consumer that is known to
      cause false positives when brightness is changed by the corresponding keyboard
      button
    level: medium
    references:
    - https://redcanary.com/blog/threat-detection/child-processes/
    - https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
    tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1546.003
  name: WMI Persistence - Script Event Consumer

