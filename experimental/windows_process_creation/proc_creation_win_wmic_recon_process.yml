detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: and
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: ends with
          path: event/FILE_PATH
          value: \WMIC.exe
        - case sensitive: false
          op: is
          path: event/ORIGINAL_FILE_NAME
          value: wmic.exe
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: process
    - not: true
      op: or
      rules:
      - op: and
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: call
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: create
      - op: and
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: call
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: terminate
respond:
- action: report
  metadata:
    author: frack113
    description: 'Detects the execution of "wmic" with the "process" flag, which might
      indicate an attempt to perform reconnaissance on running processes.

      Adversaries may use wmic to query for running processes and their details as
      part of their reconnaissance efforts.

      '
    falsepositives:
    - Unknown
    level: medium
    references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wmic
    tags:
    - attack.execution
    - attack.t1047
    - attack.discovery
    - attack.t1057
  name: Potential Process Reconnaissance via Wmic.EXE

