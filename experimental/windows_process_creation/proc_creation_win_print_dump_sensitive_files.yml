detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: or
      rules:
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: \print.exe
      - case sensitive: false
        op: is
        path: event/ORIGINAL_FILE_NAME
        value: Print.EXE
    - op: and
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: -D
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: /D
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: \config\SAM
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: \config\SECURITY
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: \config\SYSTEM
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: \windows\ntds\ntds.dit
respond:
- action: report
  metadata:
    author: Ayush Anand (Securityinbits)
    description: 'Detects the abuse of the Print.exe utility for credential harvesting
      which involves using Print.Exe to copy sensitive files such as ntds.dit, SAM,
      SECURITY, or SYSTEM from the Windows directory in order to extract credentials,
      locally or remotely.

      '
    falsepositives:
    - Unlikely
    level: high
    references:
    - https://www.microsoft.com/en-us/security/blog/2026/02/06/active-exploitation-solarwinds-web-help-desk/
    - https://www.huntress.com/blog/credential-theft-expanding-your-reach-pt-2
    - https://lolbas-project.github.io/lolbas/Binaries/Print/
    tags:
    - attack.credential-access
    - attack.stealth
    - attack.t1003.003
    - attack.t1003.002
    - attack.t1218
  name: Sensitive File Dump Via Print.EXE

