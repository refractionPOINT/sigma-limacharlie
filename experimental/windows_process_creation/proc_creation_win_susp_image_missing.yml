detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - case sensitive: false
      not: true
      op: contains
      path: event/FILE_PATH
      value: \
    - not: true
      op: or
      rules:
      - not: true
        op: exists
        path: event/FILE_PATH
      - op: or
        rules:
        - case sensitive: false
          op: is
          path: event/FILE_PATH
          value: '-'
        - case sensitive: false
          op: is
          path: event/FILE_PATH
          value: ''
      - op: or
        rules:
        - op: or
          rules:
          - case sensitive: false
            op: is
            path: event/FILE_PATH
            value: MemCompression
          - case sensitive: false
            op: is
            path: event/FILE_PATH
            value: Registry
          - case sensitive: false
            op: is
            path: event/FILE_PATH
            value: System
          - case sensitive: false
            op: is
            path: event/FILE_PATH
            value: vmmem
          - case sensitive: false
            op: is
            path: event/FILE_PATH
            value: vmmemWSL
        - op: or
          rules:
          - case sensitive: false
            op: is
            path: event/COMMAND_LINE
            value: MemCompression
          - case sensitive: false
            op: is
            path: event/COMMAND_LINE
            value: Registry
          - case sensitive: false
            op: is
            path: event/COMMAND_LINE
            value: vmmem
          - case sensitive: false
            op: is
            path: event/COMMAND_LINE
            value: vmmemWSL
respond:
- action: report
  metadata:
    author: Max Altgelt (Nextron Systems)
    description: 'Detects process creation events where the Image field lacks an absolute
      path,

      which occurs when the backing file no longer exists on disk at the time of

      logging - commonly caused by Process Ghosting or other unorthodox process creation
      techniques.

      '
    falsepositives:
    - Unknown
    level: high
    references:
    - https://pentestlaboratories.com/2021/12/08/process-ghosting/
    - https://www.elastic.co/blog/process-ghosting-a-new-executable-image-tampering-attack
    tags:
    - attack.stealth
    - attack.privilege-escalation
    - attack.t1055
  name: Execution Of Non-Existing File

