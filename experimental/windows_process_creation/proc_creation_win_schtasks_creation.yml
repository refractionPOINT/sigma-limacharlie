detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: and
      rules:
      - op: and
        rules:
        - case sensitive: false
          op: ends with
          path: event/FILE_PATH
          value: \schtasks.exe
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: ' /create '
      - not: true
        op: or
        rules:
        - case sensitive: false
          op: contains
          path: event/USER_NAME
          value: AUTHORI
        - case sensitive: false
          op: contains
          path: event/USER_NAME
          value: AUTORI
    - not: true
      op: and
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: is
          path: event/PARENT/FILE_PATH
          value: C:\Program Files\Microsoft Office\root\integration\integrator.exe
        - case sensitive: false
          op: is
          path: event/PARENT/FILE_PATH
          value: C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe
      - op: or
        rules:
        - case sensitive: false
          op: is
          path: event/FILE_PATH
          value: C:\Windows\System32\schtasks.exe
        - case sensitive: false
          op: is
          path: event/FILE_PATH
          value: C:\Windows\SysWOW64\schtasks.exe
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: Microsoft\Office\Office Performance Monitor
respond:
- action: report
  metadata:
    author: Florian Roth (Nextron Systems)
    description: Detects the creation of scheduled tasks by user accounts via the
      "schtasks" utility.
    falsepositives:
    - Administrative activity
    - Software installation
    level: low
    references:
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
    tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
    - attack.s0111
    - car.2013-08-001
    - stp.1u
  name: Scheduled Task Creation Via Schtasks.EXE

