detect:
  events:
  - NEW_PROCESS
  - EXISTING_PROCESS
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: or
      rules:
      - case sensitive: false
        op: is
        path: event/ORIGINAL_FILE_NAME
        value: wmic.exe
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: \WMIC.exe
    - op: and
      rules:
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ActiveScriptEventConsumer
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: ' CREATE '
respond:
- action: report
  metadata:
    author: Florian Roth (Nextron Systems)
    description: 'Detects the attempt to create an ActiveScriptEventConsumer via WMIC.EXE.

      An ActiveScriptEventConsumer is a built-in Windows Management Instrumentation
      (WMI) class that

      automatically executes a predefined script (in VBScript or JScript) whenever
      a specific system event occurs.

      Adversaries often abuse ActiveScriptEventConsumer to maintain persistence on
      a compromised host by executing a malicious script whenever a specific event
      occurs.

      '
    falsepositives:
    - Legitimate software creating script event consumers
    level: high
    references:
    - https://twitter.com/johnlatwc/status/1408062131321270282?s=12
    - https://www.fireeye.com/content/dam/fireeye-www/global/en/current-threats/pdfs/wp-windows-management-instrumentation.pdf
    tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1546.003
  name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE

