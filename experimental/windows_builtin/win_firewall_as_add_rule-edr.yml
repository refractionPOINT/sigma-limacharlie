detect:
  event: WEL
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: and
      rules:
      - op: or
        rules:
        - case sensitive: false
          op: is
          path: event/EVENT/System/EventID
          value: '2004'
        - case sensitive: false
          op: is
          path: event/EVENT/System/EventID
          value: '2071'
        - case sensitive: false
          op: is
          path: event/EVENT/System/EventID
          value: '2097'
      - not: true
        op: or
        rules:
        - case sensitive: false
          op: is
          path: event/EVENT/EventData/Action
          value: '2'
        - op: or
          rules:
          - case sensitive: false
            op: starts with
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Program Files (x86)\
          - case sensitive: false
            op: starts with
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Program Files\
          - case sensitive: false
            op: starts with
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Windows\System32\
          - case sensitive: false
            op: starts with
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Windows\SysWOW64\
          - case sensitive: false
            op: starts with
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Windows\WinSxS\
        - op: or
          rules:
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/ApplicationPath
            value: C:\PerfLogs\
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Temp\
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Tmp\
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Users\Public\
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Windows\Tasks\
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/ApplicationPath
            value: C:\Windows\Temp\
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/ApplicationPath
            value: \AppData\Local\Temp\
        - op: and
          rules:
          - case sensitive: false
            op: is
            path: event/EVENT/EventData/ApplicationPath
            value: System
          - case sensitive: false
            op: is
            path: event/EVENT/EventData/ModifyingApplication
            value: C:\Windows\System32\dllhost.exe
        - op: and
          rules:
          - case sensitive: false
            op: starts with
            path: event/EVENT/EventData/ModifyingApplication
            value: C:\Windows\WinSxS\
          - case sensitive: false
            op: ends with
            path: event/EVENT/EventData/ModifyingApplication
            value: \TiWorker.exe
        - not: true
          op: exists
          path: event/EVENT/EventData/ApplicationPath
    - not: true
      op: or
      rules:
      - op: and
        rules:
        - op: or
          rules:
          - case sensitive: false
            op: is
            path: event/EVENT/EventData/ModifyingApplication
            value: C:\Windows\System32\svchost.exe
          - case sensitive: false
            op: is
            path: event/EVENT/EventData/ModifyingApplication
            value: C:\Windows\System32\dllhost.exe
        - case sensitive: false
          op: is
          path: event/EVENT/EventData/ApplicationPath
          value: ''
      - op: or
        rules:
        - op: and
          rules:
          - op: or
            rules:
            - case sensitive: false
              op: starts with
              path: event/EVENT/EventData/ModifyingApplication
              value: C:\ProgramData\Microsoft\Windows Defender\Platform\
            - case sensitive: false
              op: starts with
              path: event/EVENT/EventData/ModifyingApplication
              value: C:\Program Files\Windows Defender\
          - case sensitive: false
            op: ends with
            path: event/EVENT/EventData/ModifyingApplication
            value: \MsMpEng.exe
        - op: and
          rules:
          - op: or
            rules:
            - case sensitive: false
              op: starts with
              path: event/EVENT/EventData/ApplicationPath
              value: C:\ProgramData\Microsoft\Windows Defender\Platform\
            - case sensitive: false
              op: starts with
              path: event/EVENT/EventData/ApplicationPath
              value: C:\Program Files\Windows Defender\
          - case sensitive: false
            op: ends with
            path: event/EVENT/EventData/ApplicationPath
            value: \MsMpEng.exe
      - op: and
        rules:
        - case sensitive: false
          op: starts with
          path: event/EVENT/EventData/ApplicationPath
          value: C:\Windows\SystemApps\
        - case sensitive: false
          op: is
          path: event/EVENT/EventData/ModifyingApplication
          value: C:\Windows\System32\svchost.exe
respond:
- action: report
  metadata:
    author: frack113
    description: Detects when a rule has been added to the Windows Firewall exception
      list
    level: medium
    references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
    tags:
    - attack.defense-impairment
    - attack.t1686.003
  name: Uncommon New Firewall Rule Added In Windows Firewall Exception List

