detect:
  event: WEL
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - op: or
      rules:
      - case sensitive: false
        op: is
        path: event/EVENT/System/EventID
        value: '5136'
      - case sensitive: false
        op: is
        path: event/EVENT/System/EventID
        value: '5145'
    - op: or
      rules:
      - op: and
        rules:
        - op: or
          rules:
          - case sensitive: false
            op: is
            path: event/EVENT/EventData/AttributeLDAPDisplayName
            value: gPCMachineExtensionNames
          - case sensitive: false
            op: is
            path: event/EVENT/EventData/AttributeLDAPDisplayName
            value: gPCUserExtensionNames
        - case sensitive: false
          op: contains
          path: event/EVENT/EventData/AttributeValue
          value: 42B5FAAE-6536-11D2-AE5A-0000F87571E3
        - op: or
          rules:
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/AttributeValue
            value: 40B6664F-4972-11D1-A7CA-0000F87571E3
          - case sensitive: false
            op: contains
            path: event/EVENT/EventData/AttributeValue
            value: 40B66650-4972-11D1-A7CA-0000F87571E3
      - op: and
        rules:
        - case sensitive: false
          op: ends with
          path: event/EVENT/EventData/ShareName
          value: \SYSVOL
        - op: or
          rules:
          - case sensitive: false
            op: ends with
            path: event/EVENT/EventData/RelativeTargetName
            value: \scripts.ini
          - case sensitive: false
            op: ends with
            path: event/EVENT/EventData/RelativeTargetName
            value: \psscripts.ini
        - case sensitive: false
          op: contains
          path: event/EVENT/EventData/AccessList
          value: '%%4417'
respond:
- action: report
  metadata:
    author: "Elastic, Josh Nickels, Marius Rothenb\xFCcher"
    description: 'Detects the modification of Group Policy Objects (GPO) to add a
      startup/logon script to users or computer objects.

      '
    falsepositives:
    - Legitimate execution by system administrators.
    level: medium
    references:
    - https://www.elastic.co/guide/en/security/current/startup-logon-script-added-to-group-policy-object.html
    tags:
    - attack.privilege-escalation
    - attack.t1484.001
    - attack.t1547
  name: Startup/Logon Script Added to Group Policy Object

