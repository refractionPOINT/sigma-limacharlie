detect:
  event: WEL
  op: and
  rules:
  - op: is windows
  - op: and
    rules:
    - case sensitive: false
      op: is
      path: event/EVENT/System/EventID
      value: '29'
    - case sensitive: false
      op: contains
      path: event/EVENT/EventData/Configuration
      value: /system.webServer/modules/remove
respond:
- action: report
  metadata:
    author: Nasreddine Bencherchali
    description: Detects the removal of a previously installed IIS module.
    falsepositives:
    - Legitimate administrator activity
    level: low
    references:
    - https://learn.microsoft.com/en-us/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis
    - https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
    - https://www.microsoft.com/en-us/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
    - https://learn.microsoft.com/en-us/iis/get-started/introduction-to-iis/iis-modules-overview
    tags:
    - attack.defense-evasion
    - attack.persistence
    - attack.t1562.002
    - attack.t1505.004
  name: Previously Installed IIS Module Was Removed

