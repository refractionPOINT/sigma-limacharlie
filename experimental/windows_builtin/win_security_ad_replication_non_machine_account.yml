detect:
  log type: wel
  op: and
  rules:
  - op: and
    rules:
    - op: and
      rules:
      - case sensitive: false
        op: is
        path: Event/System/EventID
        value: '4662'
      - op: or
        rules:
        - case sensitive: false
          op: contains
          path: Event/EventData/Properties
          value: 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
        - case sensitive: false
          op: contains
          path: Event/EventData/Properties
          value: 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2
        - case sensitive: false
          op: contains
          path: Event/EventData/Properties
          value: 9923a32a-3607-11d2-b9be-0000f87a36b2
        - case sensitive: false
          op: contains
          path: Event/EventData/Properties
          value: 89e95b76-444d-4c62-991a-0facbeda640c
    - case sensitive: false
      not: true
      op: ends with
      path: Event/EventData/SubjectUserName
      value: $
  - not: true
    op: or
    rules:
    - case sensitive: false
      op: is
      path: Event/EventData/SubjectDomainName
      value: Window Manager
    - op: or
      rules:
      - case sensitive: false
        op: starts with
        path: Event/EventData/SubjectUserName
        value: NT AUT
      - case sensitive: false
        op: starts with
        path: Event/EventData/SubjectUserName
        value: MSOL_
  target: log
respond:
- action: report
  metadata:
    author: Roberto Rodriguez @Cyb3rWard0g
    description: Detects potential abuse of Active Directory Replication Service (ADRS)
      from a non machine account to request credentials.
    falsepositives:
    - Unknown
    level: medium
    references:
    - https://threathunterplaybook.com/hunts/windows/180815-ADObjectAccessReplication/notebook.html
    - https://threathunterplaybook.com/library/windows/active_directory_replication.html
    - https://threathunterplaybook.com/hunts/windows/190101-ADModDirectoryReplication/notebook.html
    tags:
    - attack.credential-access
    - attack.t1003.006
  name: Active Directory Replication from Non Machine Account - DcSync Indicator

